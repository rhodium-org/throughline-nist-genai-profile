uid: SR-0009
type: system_requirement
status: approved
title: NIST AI 600-1 GV-1.3-006
text: 'Reevaluate organizational risk tolerances to account for unacceptable negative risk (such
  as where significant negative impacts are imminent, severe harms are actually occurring, or
  large-scale risks could occur); and broad GAI negative risks, including: Immature safety or
  risk cultures related to AI and GAI design, development and deployment, public information
  integrity risks, including impacts on democratic processes, unknown long-term performance
  characteristics of GAI.'
