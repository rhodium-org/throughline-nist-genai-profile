title: NIST AI 600-1 MG-3.2-002
text: Document how pre-trained models have been adapted (e.g., fine-tuned, or retrieval-augmented
  generation) for the specific generative task, including any data augmentations, parameter
  adjustments, or other modifications. Access to un-tuned (baseline) models supports debugging
  the relative influence of the pre- trained weights compared to the fine-tuned model weights
  or other system updates.
