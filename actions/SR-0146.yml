title: NIST AI 600-1 MS-2.10-001
text: 'Conduct AI red-teaming to assess issues such as: Outputting of training data samples,
  and subsequent reverse engineering, model extraction, and membership inference risks; Revealing
  biometric, confidential, copyrighted, licensed, patented, personal, proprietary, sensitive,
  or trade-marked information; Tracking or revealing location information of users or members
  of training datasets.'
