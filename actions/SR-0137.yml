title: NIST AI 600-1 MS-2.7-007
text: 'Perform AI red-teaming to assess resilience against: Abuse to facilitate attacks on other
  systems (e.g., malicious code generation, enhanced phishing content), GAI attacks (e.g., prompt
  injection), ML attacks (e.g., adversarial examples/prompts, data poisoning, membership inference,
  model extraction, sponge examples).'
