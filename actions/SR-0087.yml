title: NIST AI 600-1 MP-4.1-008
text: Re-evaluate risks when adapting GAI models to new domains. Additionally, establish warning
  systems to determine if a GAI system is being used in a new domain where previous assumptions
  (relating to context of use or mapped risks such as security, and safety) may no longer hold.
