title: NIST AI 600-1 MP-5.1-002
text: Identify potential content provenance harms of GAI, such as misinformation or disinformation,
  deepfakes, including NCII, or tampered content. Enumerate and rank risks based on their likelihood
  and potential impact, and determine how well provenance solutions address specific risks and/or
  harms.
