uid: SR-0189
type: system_requirement
status: approved
title: NIST AI 600-1 MG-3.1-004
text: Take reasonable measures to review training data for CBRN information, and intellectual
  property, and where appropriate, remove it. Implement reasonable measures to prevent, flag,
  or take other action in response to outputs that reproduce particular training data (e.g.,
  plagiarized, trademarked, patented, licensed content or trade secret material).
